[package]
name = "apppw-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
apppw-core = { path = "../apppw-core" }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http1", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
rcgen = "0.14"
rustls = "0.23"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-rustls = "0.26"
